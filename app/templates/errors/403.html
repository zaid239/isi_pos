{% extends "base.html" %}
{% block title %}Access Denied (403){% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="card text-center p-4 p-md-5">
            <div class="display-1 fw-bold mb-3" style="color: var(--danger);">403</div>
            <h3 class="fw-bold mb-2">Access Forbidden</h3>
            <p class="text-secondary mb-4">You do not have administrative clearance to access this module.</p>
            <div>
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2">
                    <i class="bi bi-house me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
