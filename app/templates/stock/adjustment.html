{% extends "base.html" %}

{% block title %}Physical Stock Count Adjustment - Noventra POS{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-4" style="max-width: 900px;">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb small mb-1">
                    <li class="breadcrumb-item"><a href="{{ url_for('stock.index') }}">Stock</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Physical Count</li>
                </ol>
            </nav>
            <h1 class="h3 mb-0 fw-bold" style="color: var(--text-primary);">Physical Count Adjustment</h1>
        </div>
        <a href="{{ url_for('stock.index') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Back to Stock
        </a>
    </div>

    <form method="POST" action="{{ url_for('stock.adjustment') }}" id="adjForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="idempotency_key" value="{{ idempotency_key }}">

        <div class="card border-0 shadow-sm rounded-3 mb-4">
            <div class="card-header bg-white py-3 border-bottom">
                <h6 class="card-title mb-0 fw-bold" style="color: var(--text-primary);">
                    <i class="bi bi-sliders me-2 text-warning"></i>Details
                </h6>
            </div>
            <div class="card-body p-4">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-semibold">Select Item to Reconcile <span class="text-danger">*</span></label>
                        <select name="item_id" id="itemSelect" class="form-select form-select-lg" required>
                            <option value="">-- Choose Tracked Item --</option>
                            {% for it in items %}
                            <option value="{{ it.id }}" 
                                    data-stock="{{ '%.3f'|format(it.current_stock) }}"
                                    data-unit="{{ it.unit.unit_code if it.unit else 'pcs' }}"
                                    data-allow-dec="{{ it.unit.allow_decimal if it.unit else 0 }}"
                                    {% if preselected_id == it.id %}selected{% endif %}>
                                {{ it.item_name }} ({{ it.sku }}) - Current: {{ ("%d"|format(it.current_stock)) if it.unit and not it.unit.allow_decimal else ("%.2f"|format(it.current_stock)) }} {{ it.unit.unit_code if it.unit else '' }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Current System Stock -->
                    <div class="col-12 col-md-4">
                        <label class="form-label fw-semibold text-secondary">System Current Stock</label>
                        <div class="input-group">
                            <input type="text" id="currentStockDisplay" class="form-control bg-light font-monospace fw-bold fs-5 text-end" value="0" readonly>
                            <span class="input-group-text bg-light unit-label">pcs</span>
                        </div>
                    </div>

                    <!-- Physical Count Entry -->
                    <div class="col-12 col-md-4">
                        <label class="form-label fw-semibold">Physical Counted Quantity <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="number" step="0.001" min="0" name="counted_qty" id="countedQtyInput" class="form-control font-monospace fw-bold fs-5 text-end" placeholder="0" required>
                            <span class="input-group-text unit-label">pcs</span>
                        </div>
                    </div>

                    <!-- Live Difference Indicator -->
                    <div class="col-12 col-md-4">
                        <label class="form-label fw-semibold text-secondary">Calculated Difference</label>
                        <div class="input-group">
                            <input type="text" id="differenceDisplay" class="form-control bg-light font-monospace fw-bold fs-5 text-end" value="0" readonly>
                            <span class="input-group-text bg-light unit-label">pcs</span>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Mandatory Reason for Adjustment <span class="text-danger">*</span></label>
                        <input type="text" name="reason" class="form-control" placeholder="e.g. Monthly physical inventory audit variance, scale discrepancy" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Audit Notes</label>
                        <textarea name="notes" rows="2" class="form-control" placeholder="Optional audit details or batch notes"></textarea>
                    </div>
                </div>
            </div>
            <div class="card-footer bg-light py-3 d-flex justify-content-end align-items-center">
                <div class="d-flex gap-2">
                    <a href="{{ url_for('stock.index') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-warning text-dark px-4 fw-semibold" id="submitBtn">
                        <i class="bi bi-check2-square me-1"></i>Apply Adjustment
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const itemSelect = document.getElementById('itemSelect');
    const currentStockDisplay = document.getElementById('currentStockDisplay');
    const countedQtyInput = document.getElementById('countedQtyInput');
    const differenceDisplay = document.getElementById('differenceDisplay');
    const unitLabels = document.querySelectorAll('.unit-label');
    const form = document.getElementById('adjForm');
    const submitBtn = document.getElementById('submitBtn');

    let currentStock = 0;

    function updateItem() {
        const opt = itemSelect.selectedOptions[0];
        if (opt && opt.value) {
            currentStock = parseFloat(opt.getAttribute('data-stock') || '0');
            const unit = opt.getAttribute('data-unit') || 'pcs';
            const allowDec = opt.getAttribute('data-allow-dec') === '1';

            currentStockDisplay.value = allowDec ? currentStock.toFixed(3) : Math.round(currentStock);
            unitLabels.forEach(el => el.textContent = unit);
            countedQtyInput.step = allowDec ? "0.001" : "1";
            countedQtyInput.placeholder = allowDec ? "0.000" : "0";
        } else {
            currentStock = 0;
            currentStockDisplay.value = "0";
            unitLabels.forEach(el => el.textContent = 'pcs');
            countedQtyInput.step = "1";
            countedQtyInput.placeholder = "0";
        }
        calcDiff();
    }

    function calcDiff() {
        const opt = itemSelect.selectedOptions[0];
        const allowDec = opt && opt.getAttribute('data-allow-dec') === '1';
        if (countedQtyInput.value === "") {
            differenceDisplay.value = allowDec ? "0.000" : "0";
            differenceDisplay.className = "form-control bg-light font-monospace fw-bold fs-5 text-end text-muted";
            return;
        }
        const counted = parseFloat(countedQtyInput.value || '0');
        const diff = counted - currentStock;
        const prefix = diff > 0 ? "+" : "";
        const diffStr = allowDec ? diff.toFixed(3) : Math.round(diff).toString();
        differenceDisplay.value = prefix + diffStr;

        if (diff > 0) {
            differenceDisplay.className = "form-control bg-success-subtle text-success border-success font-monospace fw-bold fs-5 text-end";
        } else if (diff < 0) {
            differenceDisplay.className = "form-control bg-danger-subtle text-danger border-danger font-monospace fw-bold fs-5 text-end";
        } else {
            differenceDisplay.className = "form-control bg-light font-monospace fw-bold fs-5 text-end text-dark";
        }
    }

    itemSelect.addEventListener('change', updateItem);
    countedQtyInput.addEventListener('input', calcDiff);

    if (itemSelect.value) {
        updateItem();
    }

    // Double submit protection
    let isSubmitting = false;
    form.addEventListener('submit', function(e) {
        if (!itemSelect.value || countedQtyInput.value === "") {
            e.preventDefault();
            alert("Please pick an item and enter the physical counted quantity.");
            return false;
        }
        if (isSubmitting) {
            e.preventDefault();
            return false;
        }
        isSubmitting = true;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Applying Count...';
    });
});
</script>
{% endblock %}
