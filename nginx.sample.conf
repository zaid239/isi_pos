# ==============================================================================
# Nginx Sample Configuration for Production Flask POS System
# ==============================================================================

server {
    listen 80;
    server_name pos.institutional.local;
    client_max_body_size 5M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Assets
    location /static/ {
        alias /path/to/isi_pos/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Protected Uploads Directory: Strictly prevent execution of uploaded files (Section 35 & 38.6)
    location /static/uploads/ {
        alias /path/to/isi_pos/app/static/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        # Forbid execution of any script or binary files
        location ~* \.(php|pl|py|cgi|sh|bash|exe|bat|cmd|vbs|js|html|htm|svg)$ {
            deny all;
            return 403;
        }
        expires 7d;
    }

    # Reverse Proxy to WSGI Server (Gunicorn on Linux or Waitress on Windows)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & Long Polling Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
